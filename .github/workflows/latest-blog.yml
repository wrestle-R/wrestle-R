name: Daily profile update

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Run generation without committing changes'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: latest-blog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh latest blog post
        run: python scripts/update_latest_blog.py
      - name: Refresh public account summary
        run: python scripts/update_account_stats.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save daily profile changes
        if: ${{ inputs.verify_only != true }}
        run: |
          git add README.md assets/generated
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'profile updated'
            git push origin HEAD:main
          fi
